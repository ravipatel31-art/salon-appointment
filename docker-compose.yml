# Salon — single-host deploy stack (salon-integration, phase 7).
#
#   cp deploy/.env.example .env    # fill secrets — NEVER commit .env
#   docker compose up -d --build
#   curl -f http://localhost:8000/health
#
# Services:
#   db  — PostgreSQL 16 (volume: salon_pgdata)
#   api — FastAPI image (deploy/Dockerfile.api): alembic migrate → seed → uvicorn.
#         In-process hold-expiry worker (HOLD_EXPIRY_WORKER=1) sweeps 12-min holds.
#
# HTTPS: the stack speaks plain HTTP on ${API_PORT:-8000}. Terminate TLS in
# front of it — Caddy/nginx on the same VPS (see deploy/NOTES.md), or use
# Render's automatic https://*.onrender.com domain. Razorpay webhooks require
# an HTTPS public URL.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-salon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-salon}
    volumes:
      - salon_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salon -d salon"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    restart: unless-stopped
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Password must be URL-safe (or percent-encoded) inside DATABASE_URL.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-salon}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-salon}
      APP_NAME: ${APP_NAME:-Salon API}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      PORT: ${API_PORT:-8000}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      # Seed admin (python -m app.seed) — leave empty to skip admin seeding.
      ADMIN_PHONE: ${ADMIN_PHONE:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      # Razorpay — real keys for prod, RAZORPAY_MOCK=1 only for offline demos.
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      RAZORPAY_MOCK: ${RAZORPAY_MOCK:-0}
      # Booking policy defaults match AGENTS.md (override only if needed).
      BOOKING_HOLD_MINUTES: ${BOOKING_HOLD_MINUTES:-12}
      CANCEL_REFUND_WINDOW_HOURS: ${CANCEL_REFUND_WINDOW_HOURS:-2}
      HOLD_EXPIRY_WORKER: ${HOLD_EXPIRY_WORKER:-1}
      HOLD_EXPIRY_INTERVAL_SECONDS: ${HOLD_EXPIRY_INTERVAL_SECONDS:-30}
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request,os; urllib.request.urlopen('http://127.0.0.1:' + os.environ.get('PORT','8000') + '/health')\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  salon_pgdata:
